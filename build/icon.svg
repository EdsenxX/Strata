<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Ícono de Strata: tres capas (estratos) sobre un cuadro neumórfico. Fuente para `npm run icon`. -->
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f9fc"/>
      <stop offset="1" stop-color="#d7dde8"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#b9c1cf"/>
    </linearGradient>
    <linearGradient id="layerTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7f8eff"/>
      <stop offset="1" stop-color="#4251dc"/>
    </linearGradient>
    <linearGradient id="layerMid" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#aab4ff"/>
      <stop offset="1" stop-color="#6a7aef"/>
    </linearGradient>
    <linearGradient id="layerBottom" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d6dbff"/>
      <stop offset="1" stop-color="#9aa6f6"/>
    </linearGradient>
    <filter id="tileShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#4a5570" flood-opacity="0.28"/>
    </filter>
    <filter id="layerShadow" x="-20%" y="-30%" width="140%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#2b3480" flood-opacity="0.30"/>
    </filter>
  </defs>

  <!-- Cuadro base -->
  <rect x="72" y="64" width="880" height="880" rx="200" fill="url(#surface)" filter="url(#tileShadow)"/>
  <rect x="72" y="64" width="880" height="880" rx="200" fill="none" stroke="url(#rim)" stroke-width="6"/>

  <!-- Capas: de abajo hacia arriba -->
  <g filter="url(#layerShadow)">
    <path d="M512 486 L784 632 L512 778 L240 632 Z" fill="url(#layerBottom)"/>
    <path d="M512 380 L784 526 L512 672 L240 526 Z" fill="url(#layerMid)"/>
    <path d="M512 248 L784 394 L512 540 L240 394 Z" fill="url(#layerTop)"/>
  </g>
</svg>
