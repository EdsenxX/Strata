appId: global.edsen.strata
productName: Strata
directories:
  buildResources: build
  output: dist
files:
  - out/**
  - package.json
  - '!**/.env'
asar: true
win:
  target:
    - target: nsis
      arch: [x64]
  artifactName: ${productName}-${version}-setup.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
linux:
  target:
    - AppImage
    - deb
  category: Office
  maintainer: Eduardo Serrano
  artifactName: ${productName}-${version}-${arch}.${ext}
