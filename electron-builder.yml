# Configuración de empaquetado. Los nombres de los instaladores NO llevan versión para que
# los enlaces "releases/latest/download/<archivo>" del README siempre apunten a la última release.
appId: global.edsen.strata
productName: Strata
directories:
  buildResources: build
  output: dist
files:
  - out/**
  - package.json
  - '!**/.env'
asar: true
win:
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: Strata-Setup-x64.${ext}
linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  category: Office
  syncDesktopName: true
  maintainer: Eduardo Serrano
  synopsis: Gestor de tareas por entornos, proyectos y fases
  artifactName: Strata-x64.${ext}
